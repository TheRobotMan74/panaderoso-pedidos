# Arma y publica la app en cada cambio.
# - En pull requests: revisa el código, corre las pruebas y deja la APK como "artifact".
# - En main, con Shorebird configurado (secreto SHOREBIRD_TOKEN):
#     · Si el cambio es solo de pantallas o lógica (código Dart), manda una "mejora"
#       (parche de Shorebird) que les llega sola a los celulares, sin reinstalar nada.
#     · Si cambió algo que un parche no puede llevar (plugins, permisos, Android, imágenes),
#       arma una APK nueva y la publica en Releases. La app avisa "Hay una versión nueva".
#     · Si el cambio no toca la app (funciones, reglas, README), no publica nada.
# - En main sin Shorebird: como antes, publica la APK en Releases en cada cambio.
# Para forzar una APK nueva: Actions → APK → Run workflow → marcar "Armar APK nueva".
#
# Google Play: cada APK nueva trae también su paquete para Play (panaderoso.aab), de la
# misma versión de Shorebird, así las mejoras les llegan igual a los de Play y a los de
# GitHub. El .aab queda en la corrida (Artifacts → panaderoso-google-play-vN) para subirlo
# a mano; con el secreto PLAY_SERVICE_ACCOUNT_JSON se sube solo a Play (pista "alpha" =
# prueba cerrada; se cambia con la variable PLAY_TRACK, p. ej. "production").
#
# Las mejoras y las APK se arman con --no-tree-shake-icons (la fuente de íconos completa),
# para que usar un ícono nuevo ya no obligue a sacar una APK nueva.
name: APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apk_nueva:
        description: 'Armar APK nueva aunque el cambio se pueda mandar como mejora'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  # En main no se corta un armado a la mitad: podría quedar una versión publicada a medias.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # La misma versión de Flutter para revisar, armar y mandar mejoras (Shorebird ya la soporta).
  FLUTTER_VERSION: '3.50.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 'true' cuando el cambio entró a main (o se corrió a mano sobre main).
      PUBLICA: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      # 'true' cuando ya está el secreto de Shorebird. Solo dice si existe, no lo muestra.
      CON_SHOREBIRD: ${{ secrets.SHOREBIRD_TOKEN != '' }}
      # 'true' cuando ya está la llave para subir a Google Play.
      CON_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Todo el historial, para ver qué archivos cambiaron.
          fetch-depth: 0

      # Java 21: el lint de Android que corre en el armado usa métodos de Java 21
      # (con Java 17 truena con NoSuchMethodError: List.removeLast).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Llave de firma fija, para que cada APK nueva se instale encima de la anterior.
      # Si los secretos no existen, se usa la llave de pruebas.
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      # ---------- APK normal: pull requests, y main mientras no esté Shorebird ----------

      - name: Armar APK
        if: env.PUBLICA != 'true' || env.CON_SHOREBIRD != 'true'
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk panaderoso.apk

      - name: Publicar en Releases
        if: env.PUBLICA == 'true' && env.CON_SHOREBIRD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Panaderoso v${{ github.run_number }}
          make_latest: true
          files: panaderoso.apk

      # ---------- main con Shorebird: mejora (parche) o APK nueva ----------

      - name: Instalar Shorebird
        if: env.PUBLICA == 'true' && env.CON_SHOREBIRD == 'true'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # La primera vez crea la app en Shorebird y guarda su número (shorebird.yaml) en main.
      - name: Conectar con Shorebird (solo la primera vez)
        id: init
        if: env.PUBLICA == 'true' && env.CON_SHOREBIRD == 'true' && hashFiles('shorebird.yaml') == ''
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # shorebird init necesita android/gradlew, que no se guarda en el repo:
          # Flutter lo genera sin armar nada con --config-only.
          flutter build apk --config-only
          shorebird init --display-name "Panaderoso"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add shorebird.yaml pubspec.yaml
          git commit -m "Conectar la app con Shorebird (shorebird.yaml)"
          for intento in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "nueva=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::No se pudo guardar shorebird.yaml en main. El app_id está arriba en este paso."
          exit 1

      - name: Decidir si va como mejora o como APK nueva
        id: decidir
        if: env.PUBLICA == 'true' && env.CON_SHOREBIRD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          APK_NUEVA: ${{ inputs.apk_nueva }}
          APP_NUEVA: ${{ steps.init.outputs.nueva }}
        run: |
          # Si el cambio no toca la app (funciones, reglas, README), no hay nada que mandar.
          if [ "$EVENTO" = push ] && [ -n "$ANTES" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$ANTES" HEAD | grep -qE '^(lib/|assets/|android/|pubspec\.(yaml|lock)$|shorebird\.yaml$)'; then
              echo "modo=nada" >> "$GITHUB_OUTPUT"
              echo "### Este cambio no toca la app: no se publicó nada" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # La última APK armada con Shorebird trae su versión en las notas ("Shorebird: 1.0.0+25").
          base=$(gh release view --json body --jq .body 2>/dev/null | tr -d '\r' \
            | sed -n 's/^Shorebird: *\([^ ]*\).*$/\1/p' | head -1 || true)
          if [ "$APK_NUEVA" = true ] || [ "$APP_NUEVA" = true ] || [ -z "$base" ]; then
            echo "modo=apk" >> "$GITHUB_OUTPUT"
          else
            echo "modo=mejora" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

      # Shorebird compara con la última APK. Si hay cambios que un parche no puede llevar
      # (código nativo o imágenes), no manda nada y en el siguiente paso se arma una APK nueva.
      - name: Mandar mejora (parche de Shorebird)
        id: mejora
        if: steps.decidir.outputs.modo == 'mejora'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          BASE: ${{ steps.decidir.outputs.base }}
        run: |
          set +e
          shorebird patch android --release-version="$BASE" --track=stable -- --no-tree-shake-icons 2>&1 | tee mejora.log
          codigo=${PIPESTATUS[0]}
          set -e
          if [ "$codigo" -eq 0 ]; then
            numero=$(sed -n 's/.*Published Patch \([0-9][0-9]*\).*/\1/p' mejora.log | tail -1)
            echo "resultado=ok" >> "$GITHUB_OUTPUT"
            echo "numero=$numero" >> "$GITHUB_OUTPUT"
          elif grep -q "create a new release" mejora.log; then
            echo "::notice::Este cambio trae piezas que una mejora no puede llevar. Se arma una APK nueva."
            echo "resultado=necesita_apk" >> "$GITHUB_OUTPUT"
          else
            exit "$codigo"
          fi

      - name: Anotar la mejora en la versión publicada
        if: steps.mejora.outputs.resultado == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.mejora.outputs.numero }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          # En un merge, la primera línea con texto del cuerpo es el título del pull request.
          titulo=$(git log -1 --format=%b | sed -n '/[^[:space:]]/{p;q;}')
          [ -n "$titulo" ] || titulo=$(git log -1 --format=%s)
          gh release view "$tag" --json body --jq .body > notas.md
          printf '\n- Mejora %s (%s): %s\n' "$NUMERO" "$(TZ=America/Mexico_City date +%d/%m/%Y)" "$titulo" >> notas.md
          gh release edit "$tag" --notes-file notas.md
          echo "### ✅ Mejora $NUMERO enviada a $tag: les llega sola a los celulares" >> "$GITHUB_STEP_SUMMARY"

      - name: Armar APK nueva con Shorebird
        id: apk
        if: steps.decidir.outputs.modo == 'apk' || steps.mejora.outputs.resultado == 'necesita_apk'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          NUMERO: ${{ github.run_number }}
        run: |
          # --artifact=apk arma las dos: el .aab (Google Play) y la .apk (GitHub), con el mismo código.
          shorebird release android --flutter-version="$FLUTTER_VERSION" --artifact=apk --build-number="$NUMERO" \
            -- --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk panaderoso.apk
          cp build/app/outputs/bundle/release/app-release.aab panaderoso.aab
          nombre=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          echo "version=$nombre+$NUMERO" >> "$GITHUB_OUTPUT"
          echo "### 📦 APK nueva v$NUMERO publicada: la app avisa para descargarla" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK nueva en Releases
        if: steps.apk.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Panaderoso v${{ github.run_number }}
          make_latest: true
          files: panaderoso.apk
          body: |
            APK nueva: trae cambios que una mejora automática no puede llevar.
            Quien tenga la app verá el aviso "Hay una versión nueva" para descargarla.

            Shorebird: ${{ steps.apk.outputs.version }}

      - uses: actions/upload-artifact@v4
        if: hashFiles('panaderoso.apk') != ''
        with:
          name: panaderoso-apk
          path: panaderoso.apk

      # ---------- Google Play ----------

      - name: Guardar el paquete para Google Play (.aab)
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: panaderoso-google-play-v${{ github.run_number }}
          path: panaderoso.aab
          retention-days: 90

      - name: Subir a Google Play
        if: steps.apk.outcome == 'success' && env.CON_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: mx.panaderoso.pedidos
          releaseFiles: panaderoso.aab
          releaseName: v${{ github.run_number }}
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}

      - name: Anotar Google Play en el resumen
        if: steps.apk.outcome == 'success'
        run: |
          if [ "$CON_PLAY" = true ]; then
            echo "### ▶️ v${{ github.run_number }} subida a Google Play (pista ${{ vars.PLAY_TRACK || 'alpha' }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ▶️ Paquete para Google Play listo: Artifacts → panaderoso-google-play-v${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          fi

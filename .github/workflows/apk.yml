# Arma la APK en cada cambio.
# - En pull requests: revisa el código, corre las pruebas y deja la APK como "artifact".
# - En main: además publica la APK en Releases ("Última versión") para descargarla con un enlace.
name: APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Java 21: el lint de Android que corre en el armado usa métodos de Java 21
      # (con Java 17 truena con NoSuchMethodError: List.removeLast).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Llave de firma fija, para que cada APK nueva se instale encima de la anterior.
      # Si los secretos no existen, se usa la llave de pruebas.
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Armar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk panaderoso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: panaderoso-apk
          path: panaderoso.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Panaderoso v${{ github.run_number }}
          make_latest: true
          files: panaderoso.apk
